project:
  name: GSE159677_Carotid_MainProject
  species: Homo sapiens
  output_root: results
  seed: 123

inputs:
  gse260657_dir: /public3/DSC/single_cell/GSE260657_Carotid
  gse247238_dir: /public3/DSC/single_cell/GSE247238_Carotid
  gse131778_file: /public3/DSC/single_cell/GSE131778_Coronary_AC/GSE131778_human_coronary_scRNAseq.txt
  gse210152_rds: /public3/DSC/single_cell/GSE210152_Carotid_AC/GSE210152_raw.RDS
  gse155468_dir: /public3/DSC/single_cell/GSE155468_AscAorta_Control_PA
  gse213740_dir: /public3/DSC/single_cell/GSE213740_AscAorta_Control_PA
  gse216860_dir: /public3/DSC/single_cell/GSE216860_Carotid_PA
  gse159677_dir: /public3/DSC/single_cell/GSE159677_Carotid_MainProject
  existing_integrated_rds: /public3/DSC/single_cell/Result/figer_new/group_result.rds

directory_10x_datasets:
  - dataset: GSE213740
    path: /public3/DSC/single_cell/GSE213740_AscAorta_Control_PA
    ac_pa: Control AscAorta
    notes: "Three samples overlap with GSE216860 in the exploratory script; keep configurable for reproducibility."
  - dataset: GSE234077
    path: /public3/DSC/single_cell/GSE234077_Carotid_AC
    ac_pa: Carotid Atherosclerotic Core
    notes: "Directory-based carotid AC 10X dataset from the source script."
  - dataset: GSE224273
    path: /public3/DSC/single_cell/GSE224273_Carotid_AC
    ac_pa: Carotid Atherosclerotic Core
    notes: "Directory-based carotid AC 10X dataset from the source script."
  - dataset: GSE253903
    path: /public3/DSC/single_cell/GSE253903_Carotid_AC
    ac_pa: Carotid Atherosclerotic Core
    notes: "Directory-based carotid AC 10X dataset from the source script."
  - dataset: GSE216860
    path: /public3/DSC/single_cell/GSE216860_Carotid_PA
    ac_pa: Control AscAorta
    notes: "Classified as Control AscAorta following the source script comments."

outputs:
  prepared_objects_rds: results/interim/prepared_seurat_objects.rds
  integrated_rds: results/interim/group_result.rds
  annotated_rds: results/interim/group_result_annotated.rds
  mo_ma_rds: results/interim/mo_ma_result.rds
  hdwgcnna_rds: results/hdWGCNA/Mo_Ma/data.rds
  macspectrum_rds: results/hdWGCNA/Mo_Ma/data_macspectrum_scored.rds
  auc_scored_rds: results/hdWGCNA/Mo_Ma/data_scored.rds
  pseudotime_rds: results/monocle3/data_pseudotime.rds

qc:
  min_cells: 3
  min_features: 200
  max_features: 6000
  max_percent_mt: 20

integration:
  method: harmony
  dims: 30
  resolution: 0.5
  batch_column: orig.ident

cell_types:
  monocyte_macrophage_labels:
    - Monocyte
    - Macrophage
    - FOAM_cells1
    - FOAM_cells2
    - Foam cells1
    - Foam cells2
  cell_type_column: Celltype_raw1
  disease_column: AC_PA

hdwgcnna:
  wgcna_name: wgcna
  group_by: Celltype_raw1
  metacell_k: 25
  soft_power: 4
  min_module_size: 50

monocle3:
  num_dim: 20
  umap_neighbors: 30
  umap_min_dist: 0.3
  cluster_resolution: 0.00001
  minimal_branch_len: 2
  selected_modules:
    - magenta
    - yellow
    - black
    - turquoise
    - brown
    - purple

macspectrum:
  assay: RNA
  slot: data
  species: hum

auc_signatures:
  marker_table: results/tables/ST2_Ma_Mo_Marker.csv
  mono_cluster_label: Classical Mono
  mono_top_n: 100
  ncores: 16
  font_family: Arial
  fonts:
    regular: /dsk2/user/dengsc/ARIAL.TTF
    bold: /dsk2/user/dengsc/ARIALBD.TTF
    italic: /dsk2/user/dengsc/ARIALI.TTF
    bolditalic: /dsk2/user/dengsc/ARIALBI.TTF

pathway:
  output_dir: results/GSEA_GSVA
  msig_category: C2
  gsea_pvalue_cutoff: 0.05
  gsva_logfc_cutoff: 0.5
  gsva_fdr_cutoff: 0.01
  metabolism_method: VISION
  metabolism_type: KEGG
  ncores: 4

apobec3a_ko:
  clone13:
    count_table: /dsk2/data/C-to-U/APOBEC3A/00.mergeRawFq/count.txt
    deg_table: /dsk2/data/C-to-U/APOBEC3A/00.mergeRawFq/ko/3A_total.csv
  clone37:
    count_table: /dsk2/who/panxy/RNAediting/CAD/count.txt
    deg_table: /public3/DSC/single_cell/DEG_ALL.csv
