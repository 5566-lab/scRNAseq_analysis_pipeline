project:
  name: APOBEC3A_atherosclerosis_multiomics
  species: Homo sapiens
  workspace_root: /public3/DSC/single_cell
  output_root: results
  seed: 123

inputs:
  gse260657_dir: /public3/DSC/single_cell/GSE260657_Carotid
  gse247238_dir: /public3/DSC/single_cell/GSE247238_Carotid
  gse131778_file: /public3/DSC/single_cell/GSE131778_Coronary_AC/GSE131778_human_coronary_scRNAseq.txt
  gse210152_rds: /public3/DSC/single_cell/GSE210152_Carotid_AC/GSE210152_raw.RDS
  gse155468_dir: /public3/DSC/single_cell/GSE155468_AscAorta_Control_PA
  gse213740_dir: /public3/DSC/single_cell/GSE213740_AscAorta_Control_PA
  gse216860_dir: /public3/DSC/single_cell/GSE216860_Carotid_PA
  gse159677_dir: /public3/DSC/single_cell/GSE159677_Carotid_MainProject
  existing_integrated_rds: /public3/DSC/single_cell/Result/sub_integrated_data_Final.rds

directory_10x_datasets:
  - dataset: GSE213740
    path: /public3/DSC/single_cell/GSE213740_AscAorta_Control_PA
    ac_pa: Control AscAorta
  - dataset: GSE234077
    path: /public3/DSC/single_cell/GSE234077_Carotid_AC
    ac_pa: Carotid Atherosclerotic Core
  - dataset: GSE224273
    path: /public3/DSC/single_cell/GSE224273_Carotid_AC
    ac_pa: Carotid Atherosclerotic Core
  - dataset: GSE253903
    path: /public3/DSC/single_cell/GSE253903_Carotid_AC
    ac_pa: Carotid Atherosclerotic Core
  - dataset: GSE216860
    path: /public3/DSC/single_cell/GSE216860_Carotid_PA
    ac_pa: Control AscAorta

outputs:
  prepared_objects_rds: results/interim/prepared_seurat_objects.rds
  integrated_rds: results/interim/group_result.rds
  annotated_rds: results/interim/group_result_annotated.rds
  mo_ma_rds: results/interim/mo_ma_result.rds
  hdwgcnna_rds: results/hdWGCNA/Mo_Ma/data.rds

qc:
  min_cells: 3
  min_features: 200
  max_features: 6000
  max_percent_mt: 20

integration:
  method: harmony
  dims: 30
  resolution: 0.5
  batch_column: orig.ident

cell_types:
  cell_type_column: Celltype_raw1
  disease_column: AC_PA
  monocyte_macrophage_labels:
    - Monocyte
    - Macrophage
    - FOAM_cells1
    - FOAM_cells2
    - Foam cells1
    - Foam cells2

hdwgcnna:
  wgcna_name: wgcna
  group_by: Celltype_raw1
  metacell_k: 25
  soft_power: 4
  min_module_size: 50

scrna:
  integrated_rds: /public3/DSC/single_cell/Result/figer_new/group_result.rds
  annotated_rds: /public3/DSC/single_cell/Result/sub_integrated_data_Final.rds
  scored_rds: /public3/DSC/single_cell/Result/figer_new/hdWGCNA/Mo_Ma/data_scored.rds
  pseudotime_rds: /public3/DSC/single_cell/Result/figer_new/monocle3/data_pseudotime.rds
  monocle_cds_rds: /public3/DSC/single_cell/Result/figer_new/monocle3/cds_MM_foam.rds
  geo_cache: /public3/DSC/single_cell/GEOquery_cache
  output_dir: results/scrna

scrna_pathway:
  output_dir: results/scrna/pathway
  msig_category: C2
  gsea_pvalue_cutoff: 0.05
  gsva_logfc_cutoff: 0.5
  gsva_fdr_cutoff: 0.01

scoring:
  top_n_per_direction: 200
  membership_csv: data/gene_sets/MMI_GSE5099_GSE11864_Top200_membership.csv
  mpi_gene_sets_csv: data/gene_sets/mpi_signatures.csv
  mmi_gene_sets_csv: data/gene_sets/mmi_top200_signatures.csv
  apobec3a_gene_set_csv: data/gene_sets/apobec3a_positive_myeloid_signature.csv
  output_dir: results/scoring

spatial:
  module_root: workflow/04_spatial
  spatial_root: /public3/DSC/single_cell/spatial
  xenium_rds: /public3/DSC/single_cell/spatial/GSE315246_xenium.obj.integrated.rds
  visium_rds: /public3/DSC/single_cell/spatial/GSE314851_Visium_FFPE_integrated.rds
  geomx_archive: /public3/DSC/single_cell/spatial/GSE277170_RAW.tar

bulk_rnaseq:
  count_table: /public7/DSC_Public7/DSC/DSC/20251004_NGS/expression_analysis/gene_counts_all.txt
  sample_manifest: metadata/rna_editing_sample_manifest.tsv
  output_dir: results/bulk_rnaseq
  min_count: 10
  min_samples: 3
  padj_cutoff: 0.05
  abs_log2fc_cutoff: 1.0
  contrasts:
    - clone13
    - clone37
    - combined

rna_editing:
  alignment_dir: /public7/DSC_Public7/DSC/DSC/20251004_NGS/Aligned
  jacusa_jar: /dell_1/dsc/RNA_seq/data/jacusa/JACUSA2-2.0.4/JACUSA_v2.0.4.jar
  reference_fasta: /dell_1/dsc/RNA_seq/data/index/GRCh38.dna.Ensembl_release_104.fa
  annotation_gtf: /dell_1/dsc/RNA_seq/data/index/Homo_sapiens.GRCh38.104.gtf
  annotation_gff3: /public7/DSC_Public7/DSC/DSC/20251004_NGS/RawData/Homo_sapiens.GRCh38.104.gff3
  kegg_rds: /public7/DSC_Public7/DSC/DSC/20251004_NGS/result/M013_result_Score1_Hybrid/kegg_hsa_offline.rds
  output_dir: results/rna_editing
  threads: 8
  min_coverage: 10
  score_cutoff: 1.0
  pvalue_cutoff: 0.10
  delta_editing_cutoff: 0.05
  wt_min_covered_replicates: 4
  ko_min_covered_replicates: 3

supplementary_tables:
  source_workspace: /public3/DSC/single_cell
  public7_ngs_result_root: /public7/DSC_Public7/DSC/DSC/20251004_NGS/result
  output_dir: results/supplementary_tables
