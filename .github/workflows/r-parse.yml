name: R static validation

on:
  push:
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R scripts
        run: Rscript -e 'files <- list.files(".", pattern="\\.[Rr]$", recursive=TRUE, full.names=TRUE); files <- files[!grepl("archive/original_scripts", files)]; for (f in files) parse(f)'
