name: Static validation

on:
  push:
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R scripts
        run: Rscript -e 'files <- list.files(".", pattern="\\.[Rr]$", recursive=TRUE, full.names=TRUE); for (f in files) parse(f)'
      - name: Parse Python scripts
        run: python -c 'import ast,pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path(".").rglob("*.py")]'
      - name: Check frozen manifests and gene sets
        run: |
          Rscript -e 'm <- read.csv("data/gene_sets/MMI_GSE5099_GSE11864_Top200_membership.csv"); stopifnot(sum(m$direction=="mature_positive")==200, sum(m$direction=="immature_negative")==200)'
          Rscript -e 'x <- read.delim("metadata/rna_editing_sample_manifest.tsv"); stopifnot(sum(x$Condition=="WT")==6, sum(x$Condition=="KO")==6, !any(grepl("THP_1", x$Sample_Name)))'
